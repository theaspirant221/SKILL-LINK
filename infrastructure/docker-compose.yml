services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: skilllink
      POSTGRES_USER: skilllink
      POSTGRES_PASSWORD: change-me
    ports:
      - "5432:5432"
    volumes:
      - skilllink-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U skilllink -d skilllink"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  ai-engine:
    build:
      context: ../ai-engine
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    profiles: ["ai"]

volumes:
  skilllink-postgres:
