spring:
  application:
    name: skilllink-api
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/skilllink}
    username: ${DATABASE_USERNAME:skilllink}
    password: ${DATABASE_PASSWORD:change-me}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:10}
      minimum-idle: 2
      connection-timeout: 3000
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
server:
  port: ${PORT:8080}
  forward-headers-strategy: framework
  error:
    include-message: never
    include-stacktrace: never
spring.task:
  execution:
    pool:
      core-size: ${ANALYSIS_WORKER_CORE_SIZE:2}
      max-size: ${ANALYSIS_WORKER_MAX_SIZE:4}
      queue-capacity: ${ANALYSIS_WORKER_QUEUE_CAPACITY:20}
    thread-name-prefix: skilllink-analysis-
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true
skilllink:
  demo-mode: ${SKILLLINK_DEMO_MODE:false}
  web-origin: ${SKILLLINK_WEB_ORIGIN:http://localhost:5173}
  frontend-success-url: ${SKILLLINK_FRONTEND_SUCCESS_URL:http://localhost:5173/app/github}
  frontend-failure-url: ${SKILLLINK_FRONTEND_FAILURE_URL:http://localhost:5173/app/github?github=error}
  security:
    jwt-secret: ${JWT_SECRET}
    encryption-key: ${TOKEN_ENCRYPTION_KEY}
    access-token-minutes: ${ACCESS_TOKEN_MINUTES:15}
    refresh-token-days: ${REFRESH_TOKEN_DAYS:30}
  github:
    # GitHub App (not a classic OAuth app). See docs/github-app-setup.md.
    app-id: ${GITHUB_APP_ID:}
    client-id: ${GITHUB_APP_CLIENT_ID:}
    client-secret: ${GITHUB_APP_CLIENT_SECRET:}
    private-key: ${GITHUB_APP_PRIVATE_KEY:}
    app-name: ${GITHUB_APP_NAME:}
    callback-url: ${GITHUB_CALLBACK_URL:http://localhost:8080/api/v1/github/callback}
    setup-url: ${GITHUB_SETUP_URL:http://localhost:8080/api/v1/github/install/callback}
    webhook-secret: ${GITHUB_WEBHOOK_SECRET:}
    api-url: ${GITHUB_API_URL:https://api.github.com}
    oauth-url: ${GITHUB_OAUTH_URL:https://github.com/login/oauth}
    api-version: ${GITHUB_API_VERSION:2026-03-10}
  ai:
    provider: ${LLM_PROVIDER:disabled}
    engine-url: ${AI_ENGINE_URL:http://localhost:8000}
    request-timeout-ms: ${AI_REQUEST_TIMEOUT_MS:5000}
  analysis:
    max-file-bytes: ${ANALYSIS_MAX_FILE_BYTES:200000}
    max-repository-bytes: ${ANALYSIS_MAX_REPOSITORY_BYTES:5000000}
    max-context-files: ${ANALYSIS_MAX_CONTEXT_FILES:80}
    max-tree-entries: ${ANALYSIS_MAX_TREE_ENTRIES:5000}
  snapshot:
    max-file-bytes: ${SNAPSHOT_MAX_FILE_BYTES:500000}
    max-repository-bytes: ${SNAPSHOT_MAX_REPOSITORY_BYTES:20000000}
    max-files: ${SNAPSHOT_MAX_FILES:1000}
    max-tree-entries: ${SNAPSHOT_MAX_TREE_ENTRIES:10000}
    max-depth: ${SNAPSHOT_MAX_DEPTH:20}
    file-policy-version: ${SNAPSHOT_FILE_POLICY_VERSION:v1}
  privacy:
    retention-days: ${PRIVACY_RETENTION_DAYS:180}
