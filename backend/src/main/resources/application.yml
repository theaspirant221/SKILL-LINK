spring:
  application:
    name: skilllink-api
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/skilllink}
    username: ${DATABASE_USERNAME:skilllink}
    password: ${DATABASE_PASSWORD:change-me}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:10}
      minimum-idle: 2
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  security:
    oauth2:
      client:
        registration: {}
server:
  port: ${PORT:8080}
  forward-headers-strategy: framework
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true
skilllink:
  demo-mode: ${SKILLLINK_DEMO_MODE:true}
  ai-engine-url: ${AI_ENGINE_URL:http://localhost:8000}
  github:
    api-url: ${GITHUB_API_URL:https://api.github.com}
    oauth-scopes: ${GITHUB_OAUTH_SCOPES:read:user,repo:status,read:project}
  analysis:
    max-file-bytes: ${ANALYSIS_MAX_FILE_BYTES:200000}
    max-context-files: ${ANALYSIS_MAX_CONTEXT_FILES:80}
  privacy:
    retention-days: ${PRIVACY_RETENTION_DAYS:180}
