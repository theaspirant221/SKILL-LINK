[project]
name = "skilllink-ai-engine"
version = "0.1.0"
description = "Grounded analysis contracts for SkillLink"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.32,<1",
  "pydantic>=2.9,<3",
]

[project.optional-dependencies]
analysis = [
  "tree-sitter>=0.24,<1",
  "tree-sitter-java>=0.23,<1",
  "tree-sitter-javascript>=0.23,<1",
  "tree-sitter-typescript>=0.23,<1",
  "tree-sitter-python>=0.23,<1",
]

test = ["pytest>=8.3,<9", "httpx>=0.27,<1"]

[tool.pytest.ini_options]
addopts = "-q"
