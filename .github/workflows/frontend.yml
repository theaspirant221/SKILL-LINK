name: frontend

on:
  push:
    paths: ['frontend/**', 'package.json', 'package-lock.json']
  pull_request:
    paths: ['frontend/**', 'package.json', 'package-lock.json']

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
        working-directory: .
      - run: npm run test
      - run: npm run build
