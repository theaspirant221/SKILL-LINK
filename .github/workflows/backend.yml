name: backend

on:
  push:
    paths: ['backend/**']
  pull_request:
    paths: ['backend/**']

permissions:
  contents: read
  checks: write

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      # The wrapper is the intended entry point (also verifies backend/mvnw is executable).
      # Failures are mirrored into check annotations so the root cause is visible without raw logs.
      - name: Wrapper sanity check
        run: |
          set +e
          ./mvnw -B --version 2>&1 | tee /tmp/wrapper-version.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            summary="$(tail -n 8 /tmp/wrapper-version.log | tr '\n' ' ' | head -c 220)"
            echo "::error title=mvnw wrapper failed::exit=$status $summary"
            exit "$status"
          fi
          echo "::notice title=mvnw wrapper ok::$(grep -m 3 -E 'Apache Maven|Java version|Maven home' /tmp/wrapper-version.log | tr '\n' ' ' | head -c 220)"
      - name: Run tests via wrapper
        run: |
          set +e
          ./mvnw -B test 2>&1 | tee /tmp/mvn.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            summary="$(grep -m 5 -E '^\[ERROR\]|Error: |BUILD FAILURE' /tmp/mvn.log | tr '\n' ' ' | head -c 220)"
            [ -n "$summary" ] || summary="$(tail -n 8 /tmp/mvn.log | tr '\n' ' ' | head -c 220)"
            echo "::error title=Maven tests failed::exit=$status $summary"
            exit "$status"
          fi
          total="$(grep -h 'Tests run:' /tmp/mvn.log | tail -n 1 | head -c 110)"
          integration="$(grep -h 'Tests run:.*IntegrationTest' /tmp/mvn.log | tr '\n' ';' | head -c 300)"
          echo "::notice title=Maven tests passed::${total} | ${integration}"
      # Raw logs and artifact downloads can be unavailable; publish per-test failure details
      # (assertion messages, chunked to the 245-char annotation limit) on a dedicated check run.
      - name: Publish failure details
        if: failure()
        run: |
          python3 - <<'EOF'
          import glob, json, os, re, subprocess

          details = []
          for path in sorted(glob.glob('target/surefire-reports/*.txt')):
              text = open(path, encoding='utf-8', errors='replace').read()
              cls = os.path.basename(path).replace('.txt', '')
              for block in text.split('<<< FAILURE!')[1:] + text.split('<<< ERROR!')[1:]:
                  lines = [line.strip() for line in block.strip().split('\n') if line.strip()][:4]
                  message = ' | '.join(lines)[:240]
                  details.append({'path': path, 'title': cls[:100], 'message': message})
          if not details:
              raise SystemExit(0)
          annotations = [{'path': d['path'], 'start_line': 1, 'end_line': 1, 'annotation_level': 'failure',
                          'title': d['title'], 'message': d['message']} for d in details[:50]]
          payload = {
              'name': 'failure-details',
              'head_sha': os.environ['GITHUB_SHA'],
              'status': 'completed',
              'conclusion': 'failure',
              'output': {'title': 'Per-test failure details', 'summary': f'{len(details)} failing test(s); details in annotations.',
                         'annotations': annotations},
          }
          subprocess.run(['gh', 'api', '--method', 'POST', f"repos/{os.environ['GITHUB_REPOSITORY']}/check-runs",
                          '--header', 'Content-Type: application/json', '--input', '-'],
                         input=json.dumps(payload), text=True, check=True)
          print(f'published {len(annotations)} failure annotations')
          EOF
        env:
          GH_TOKEN: ${{ github.token }}
      # Diagnostic fallback: proves whether a failure is wrapper-specific or a real test failure.
      - name: Fallback diagnostics via system Maven
        if: failure()
        run: |
          set +e
          mvn -B test 2>&1 | tee /tmp/mvn-system.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            summary="$(grep -m 5 -E '^\[ERROR\]|Error: |BUILD FAILURE' /tmp/mvn-system.log | tr '\n' ' ' | head -c 220)"
            [ -n "$summary" ] || summary="$(tail -n 8 /tmp/mvn-system.log | tr '\n' ' ' | head -c 220)"
            echo "::error title=system Maven also failed::exit=$status $summary"
            exit "$status"
          fi
          echo "::notice title=system Maven passed::Tests pass with system Maven; the failure above is wrapper-specific. $(grep -h 'Tests run:' /tmp/mvn-system.log | tail -n 3 | tr '\n' ' ' | head -c 160)"
      # Full surefire reports as an artifact (when downloadable) for deeper analysis.
      - name: Upload surefire reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: backend/target/surefire-reports/
          if-no-files-found: ignore
